@if (!tour()) {
	<p>Select a tour from the list</p>
} @else {
	<section class="tour-detail">
		<h2>{{ tour()!.name }}</h2>

		<div class="tour-actions">
			<button type="button" (click)="requestEdit()">Edit</button>
			<button type="button" class="danger" (click)="requestDelete()">Delete</button>
		</div>

		<div class="detail-row">
			<app-attribute-field label="From" [value]="tour()!.from" />
			<app-attribute-field label="To" [value]="tour()!.to" />
			<app-attribute-field label="Distance (km)" [value]="tour()!.distanceKm" />
			<app-attribute-field label="Estimated Time (min)" [value]="tour()!.estimatedTimeMin" />
			<app-attribute-field label="Transport Type" [value]="tour()!.transportType" />
		</div>

		@if (imagePath()) {
			<div class="tour-image-wrapper">
				<img
					[src]="imagePath()!"
					[alt]="imageAlt()"
					class="tour-image"
				/>
			</div>
		}

		<p class="tour-description">{{ tour()!.description }}</p>

		<div class="map-wrapper">
			<div #leafletMap class="tour-map" aria-label="Tour map"></div>

			@if (mapError()) {
				<p class="map-error">{{ mapError() }}</p>
			}
		</div>

		<app-tour-log-list [tourId]="tour()!.id" [logs]="logs()" (addRequested)="requestAddLog()" />
	</section>
}
