<header class="top-bar">
  <div class="top-bar-left">Tourplanner</div>

  <div class="top-bar-center">
    <input type="text" placeholder="Search..." disabled />
  </div>

  <div class="top-bar-right">
    <button type="button" disabled>Import</button>
    <button type="button" disabled>Export</button>
    <button type="button" (click)="onLogout()">Logout</button>
  </div>
</header>

<div class="layout-wrapper">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>My Tours</h2>
      <button type="button" (click)="openCreateTourForm()">+</button>
    </div>

    <app-tour-list
      [tours]="tours()"
      (tourSelected)="onTourSelected($event)"
      [selectedTourId]="selectedTour()?.id"></app-tour-list>
  </aside>

  <main class="main-content">
    @if (showCreateTourForm()) {
      <section class="form-section">
        <app-tour-form
          (tourSaved)="onTourSaved($event)"
          (cancelled)="onCreateCancelled()"></app-tour-form>
      </section>
    }

    @if (editingTour()) {
      <section class="form-section">
        <app-tour-form
          [tour]="editingTour()"
          (tourSaved)="onEditTourSaved($event)"
          (cancelled)="onEditCancelled()"></app-tour-form>
      </section>
    }

    @if (tourToDelete()) {
      <section class="form-section delete-confirmation" role="alertdialog" aria-modal="true" aria-labelledby="delete-tour-title">
        <h3 id="delete-tour-title">Delete Tour</h3>
        <p>Are you sure you want to delete "{{ tourToDelete()!.name }}"?</p>
        <div class="delete-actions">
          <button type="button" class="danger" (click)="confirmDeleteTour()">Delete</button>
          <button type="button" (click)="cancelDeleteTour()">Cancel</button>
        </div>
      </section>
    }

    @if (showCreateTourLogForm()) {
      <section class="form-section">
        <app-tour-log-form
          [log]="undefined"
          [tourId]="selectedTour()?.id ?? ''"
          (logSaved)="onTourLogSaved($event)"
          (cancelled)="onCreateTourLogCancelled()"></app-tour-log-form>
      </section>
    }

    <app-tour-detail
      [tour]="selectedTour()"
      [logs]="tourLogs()"
      (addLogRequested)="openCreateTourLogForm()"
      (editRequested)="startEditTour($event)"
      (deleteRequested)="startDeleteTour($event)"></app-tour-detail>
  </main>
</div>
